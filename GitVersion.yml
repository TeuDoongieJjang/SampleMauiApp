workflow: GitHubFlow/v1
mode: ContinuousDelivery

commit-message-incrementing: Enabled

# Match both 'patch:' and 'release-patch:'
patch-version-bump-message: '^(release-)?patch:'
minor-version-bump-message: '^(release-)?minor:'
major-version-bump-message: '^(release-)?major:'

no-bump-message: '(\[skip ci\]|\+semver:\s?(none|skip))'
tag-prefix: 'v'