name: Build and Release MAUI App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI
        run: dotnet workload install maui-android
        working-directory: ./SampleMauiApp

      - uses: gittools/actions/gitversion/setup@v3.0.0
        with:
          versionSpec: '6.x'

      - id: gitversion
        uses: gittools/actions/gitversion/execute@v3.0.0

      - name: Output Version
        run: |
          echo "GitVersion: ${{ steps.gitversion.outputs.semVer }}"
          echo "Build:      ${{ github.run_number }}"

      - name: Prepare Android Keystore
        working-directory: ./SampleMauiApp
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\n' | base64 --decode > sample_app.keystore
          echo "ANDROID_KEY_PASS=${{ secrets.ANDROID_KEY_PASS }}"     >> $GITHUB_ENV
          echo "ANDROID_STORE_PASS=${{ secrets.ANDROID_STORE_PASS }}" >> $GITHUB_ENV

      - name: Build and Publish
        working-directory: ./SampleMauiApp
        run: |
          dotnet publish -c Release -f net10.0-android \
            -p:ApplicationDisplayVersion=${{ steps.gitversion.outputs.semVer }} \
            -p:ApplicationVersion=${{ github.run_number }}

      - name: Create Tag (idempotent)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `v${{ steps.gitversion.outputs.semVer }}`;
            const { owner, repo } = context.repo;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              console.log(`Tag ${tag} already exists – skipping.`);
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.git.createRef({
                owner, repo, sha: context.sha, ref: `refs/tags/${tag}`
              });
              console.log(`Tag ${tag} created.`);
            }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          name: Release v${{ steps.gitversion.outputs.semVer }}
          allowUpdates: true
          files: |
            ./SampleMauiApp/bin/Release/net10.0-android/*.apk