name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest 

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        
    - name: Install .NET MAUI
      run: dotnet workload install maui 
      working-directory: ./SampleMauiApp
      
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./SampleMauiApp
      
    - name: Build
      run: dotnet build -c Release -f net10.0-android 
      working-directory: ./SampleMauiApp

    - name: Publish
      run: dotnet publish -c Release -f net10.0-android 
      working-directory: ./SampleMauiApp
