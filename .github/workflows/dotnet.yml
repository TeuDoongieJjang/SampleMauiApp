name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Cache NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
        
    - name: Install .NET MAUI
      run: dotnet workload install maui-android
      working-directory: ./SampleMauiApp

    - name: Publish
      run: dotnet publish -c Release -f net10.0-android 
      working-directory: ./SampleMauiApp

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with: 
        name: Android App
        path: ./SampleMauiApp/bin/Release/net10.0-android/*.apk
        retention-days: 7