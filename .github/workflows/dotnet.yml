name: Build and Release MAUI App

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
        
    - name: Install .NET MAUI
      run: dotnet workload install maui-android
      working-directory: ./SampleMauiApp

    - name: Prepare Android Keystore
      working-directory: ./SampleMauiApp
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\n' | base64 --decode > sample_app.keystore
        echo "ANDROID_KEY_PASS=${{ secrets.ANDROID_KEY_PASS }}" >> $GITHUB_ENV
        echo "ANDROID_STORE_PASS=${{ secrets.ANDROID_STORE_PASS }}" >> $GITHUB_ENV

    - name: Build and Publish
      run: dotnet publish -c Release -f net10.0-android 
      working-directory: ./SampleMauiApp

    - name: Extract Version
      id: extractVersion
      shell: pwsh
      run: |
        [xml]$xml = Get-Content ./SampleMauiApp/SampleMauiApp.csproj
        $version = ($xml.Project.PropertyGroup | Where-Object { $_.ApplicationDisplayVersion }).ApplicationDisplayVersion
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Create a Tag
      uses: actions/github-script@v9
      with: 
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            ref: 'refs/tags/v${{ steps.extractVersion.outputs.version }}'
          })

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with: 
        tag_name: v${{ steps.extractVersion.outputs.version }}
        files: |
          ./SampleMauiApp/bin/Release/net10.0-android/*.apk