name: Build and Release MAUI App

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET MAUI
      run: dotnet workload install maui-android
      working-directory: ./SampleMauiApp
        
    - name: Bump Version
      id: version_bump
      shell: bash
      working-directory: ./SampleMauiApp
      run: |
        # 1. Extract current version
        CURRENT_VERSION=$(grep -oP '(?<=<ApplicationDisplayVersion>)[^<]+' SampleMauiApp.csproj)
        IFS='.' read -r -a VERSION_PARTS <<< "$CURRENT_VERSION"
        
        MAJOR=${VERSION_PARTS[0]:-1}
        MINOR=${VERSION_PARTS[1]:-0}
        PATCH=${VERSION_PARTS[2]:-0}

        # 2. Calculate new version based on input
        if [ "${{ github.event.inputs.version_type }}" == "major" ]; then
          MAJOR=$((MAJOR + 1))
          MINOR=0
          PATCH=0
        elif [ "${{ github.event.inputs.version_type }}" == "minor" ]; then
          MINOR=$((MINOR + 1))
          PATCH=0
        else
          PATCH=$((PATCH + 1))
        fi

        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        echo "New Version: $NEW_VERSION"
        
        # 3. Update csproj
        sed -i "s|<ApplicationDisplayVersion>.*</ApplicationDisplayVersion>|<ApplicationDisplayVersion>$NEW_VERSION</ApplicationDisplayVersion>|g" SampleMauiApp.csproj
        sed -i "s|<ApplicationVersion>.*</ApplicationVersion>|<ApplicationVersion>${{ github.run_number }}</ApplicationVersion>|g" SampleMauiApp.csproj

        # 4. Output for later steps
        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

    - name: Prepare Android Keystore
      working-directory: ./SampleMauiApp
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\n' | base64 --decode > sample_app.keystore
        echo "ANDROID_KEY_PASS=${{ secrets.ANDROID_KEY_PASS }}" >> $GITHUB_ENV
        echo "ANDROID_STORE_PASS=${{ secrets.ANDROID_STORE_PASS }}" >> $GITHUB_ENV

    - name: Build and Publish
      run: dotnet publish -c Release -f net10.0-android 
      working-directory: ./SampleMauiApp

    - name: Create a Tag
      uses: actions/github-script@v6
      with: 
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            ref: 'refs/tags/v${{ env.NEW_VERSION }}'
          })

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with: 
        tag_name: v${{ env.NEW_VERSION }}
        name: Release v${{ env.NEW_VERSION }}
        files: |
          ./SampleMauiApp/bin/Release/net10.0-android/*.apk