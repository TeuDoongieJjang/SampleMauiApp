name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
        
    - name: Install .NET MAUI
      run: dotnet workload install maui-android
      working-directory: ./SampleMauiApp

    - name: Prepare Android Keystore
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > sample_app.keystore
        echo "ANDROID_KEY_PASS=${{ secrets.ANDROID_KEY_PASS }}" >> $GITHUB_ENV
        echo "ANDROID_STORE_PASS=${{ secrets.ANDROID_STORE_PASS }}" >> $GITHUB_ENV

    - name: Build and Publish
      run: dotnet publish -c Release -f net10.0-android 
      working-directory: ./SampleMauiApp

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with: 
        name: Android App
        path: ./SampleMauiApp/bin/Release/net10.0-android/*.apk
        retention-days: 7