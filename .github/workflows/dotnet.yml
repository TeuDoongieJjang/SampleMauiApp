name: Build and Release MAUI App

on:
  push:
    branches:
      - main # Triggers automatically when you push to main. Change to 'master' if needed.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # CRITICAL: GitVersion needs full history to calculate versions
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET MAUI
      run: dotnet workload install maui-android
      working-directory: ./SampleMauiApp

    # --- GITVERSION STEPS ---
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3.0.0
      with:
        versionSpec: '6.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v3.0.0
      # This generates variables like steps.gitversion.outputs.semVer (e.g., 1.2.3)

    - name: Output Version
      run: |
        echo "GitVersion calculated: ${{ steps.gitversion.outputs.semVer }}"
        echo "Build Number: ${{ github.run_number }}"
    # ------------------------

    - name: Prepare Android Keystore
      working-directory: ./SampleMauiApp
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\n' | base64 --decode > sample_app.keystore
        echo "ANDROID_KEY_PASS=${{ secrets.ANDROID_KEY_PASS }}" >> $GITHUB_ENV
        echo "ANDROID_STORE_PASS=${{ secrets.ANDROID_STORE_PASS }}" >> $GITHUB_ENV

    - name: Build and Publish
      working-directory: ./SampleMauiApp
      # We pass the version directly into the build command!
      run: |
        dotnet publish -c Release -f net10.0-android \
          -p:ApplicationDisplayVersion=${{ steps.gitversion.outputs.semVer }} \
          -p:ApplicationVersion=${{ github.run_number }}

    - name: Create a Tag
      uses: actions/github-script@v6
      with: 
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            ref: 'refs/tags/v${{ steps.gitversion.outputs.semVer }}'
          })

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with: 
        tag_name: v${{ steps.gitversion.outputs.semVer }}
        name: Release v${{ steps.gitversion.outputs.semVer }}
        files: |
          ./SampleMauiApp/bin/Release/net10.0-android/*.apk