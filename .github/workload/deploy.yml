name: Build and Release Sample .NET Maui App

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest 

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Install .NET MAUI
      run: dotnet workload install maui 
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build SampleMauiApp/SampleMauiApp.csproj -c Release -f net10.0-android --no-restore